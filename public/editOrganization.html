<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Organization | StudentLink</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/listings.css">
    <link rel="stylesheet" href="styles/explore.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body id="documentBody">

<!-- HEADER -->
<div id="header">
    <img id="logo" src="styles/images/STUDENT_LINK_LOGO.svg">
</div>

<!-- LEFT SIDEBAR -->
<div class="sidebar" id="leftBar">
    <br>
    <img class="sideProfileIcon" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"><br>
    <p id="displayName">Display Name</p>
    <p id="username">@Username</p><br>

    <p class="sidebarText"><a href="home.html">Home</a></p>
    <p class="sidebarText"><a href="listings.html">Listings</a></p>
    <p class="sidebarText"><a href="explore.html">Explore</a></p>
    <p class="sidebarText"><a href="notifications.html">Notifications</a></p>
    <p class="sidebarText"><a href="chat.html">Chat</a></p>
    <p class="sidebarText"><a href="profile.html">Profile</a></p>
    <p class="sidebarText"><a href="settings.html">Settings</a></p>
</div>

<!-- RIGHT SIDEBAR -->
<div class="sidebar" id="rightBar">
    <br>
    <input class="searchBar themeObject" placeholder="Search"><br><br>
</div>

<!-- MAIN CONTENT -->
<div class="listingContainer">

    <h2>Edit Organization</h2>

    <form id="editOrgForm">

        <!-- NAME -->
        <input class="listingInput" type="text" id="nameInput" placeholder="Organization Name" required><br>

        <!-- DESCRIPTION -->
        <textarea id="descInput" class="listingInput" placeholder="Description" required></textarea><br>

        <!-- CATEGORY -->
        <select id="categoryInput" required>
            <option value="">Select Category</option>
            <option value="academic">Academic</option>
            <option value="sports">Sports</option>
            <option value="cultural">Cultural</option>
        </select><br>

        <!-- EMAIL -->
        <input class="listingInput" type="email" id="emailInput" placeholder="Contact Email"><br>

        <!-- IMAGE SECTION -->
        <label>Organization Image</label><br><br>

        <div id="imagePreviewContainer" class="imageGallery"></div>

        <br>

        <label class="uploadBtn">
            + Change Image
            <input type="file" id="imageInput" accept="image/*" hidden>
        </label>

        <br><br>

        <!-- BUTTON -->
        <button type="submit">Save Changes</button>

    </form>

</div>

<!-- Scripts -->
<script type="module" src="js/editOrganization.js"></script>
<script type="module" src="js/userSearch.js"></script>

<script type="module">
    import { setupSidebar } from "./js/showUser.js";
    setupSidebar();
</script>

<script src="js/toggleVis.js"></script>
<script src="js/themeSwap.js"></script>

</body>
</html>
