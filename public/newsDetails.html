<!DOCTYPE html>
<html lang="en">
<head>

</head>

<div id="header">

<div id="explorePage" class="content">

    <div id="newsDetailsPage">

        <!-- TOP SECTION -->

            <h1 id="newsTitle"></h1>

            <div class="newsMeta">

                <img id="authorPhoto" class="newsAuthorImg">

                <div>
                    <p id="authorName"></p>
                    <p id="newsDate"></p>
                    <p id="orgName" class="newsOrgLink"></p>
                </div>

            </div>

        </div>

        <!-- IMAGE -->
        <img id="newsImage" class="newsHeroImage">

        <hr>

        <!-- CONTENT -->
        <div id="newsContent" class="newsContent"></div>

    </div>

</div>

<!-- RIGHT SIDEBAR -->

</div>

<br>
