<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Event | StudentLink</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/explore.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body id="documentBody">

<!-- HEADER -->
<div id="header">
    <img id="logo" src="styles/images/STUDENT_LINK_LOGO.svg">
</div>

<!-- LEFT SIDEBAR -->
<div class="sidebar" id="leftBar">

<br>
<img class="sideProfileIcon" id="profilePic" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"><br>

<p id="displayName">Display Name</p>
<p id="username">@Username</p><br>

<p class="sidebarText"><a href="home.html">Home</a></p>
<p class="sidebarText"><a href="listings.html">Listings</a></p>
<p class="sidebarText"><a href="explore.html">Explore</a></p>
<p class="sidebarText"><a href="notifications.html">Notifications</a></p>
<p class="sidebarText"><a href="chat.html">Chat</a></p>
<p class="sidebarText"><a href="profile.html">Profile</a></p>
<p class="sidebarText"><a href="settings.html">Settings</a></p>

</div>
<!-- RIGHT SIDEBAR -->
<div class="sidebar" id="rightBar">
    <br>
    <input class="searchBar themeObject" placeholder="Search"><br><br>
</div>
<!-- MAIN FORM -->
<form id="createEventForm" class="content">

    <div class="formCard">

        <h2 class="sectionTitle">Create Event</h2>

        <!-- inputs stay same -->

    </div>

</form>

    <h2 class="sectionTitle">Create Event</h2>

    <!-- TITLE -->
    <input 
        id="eventTitle" 
        class="listingInput"
        placeholder="Event Title" 
        required
    >

    <!-- DESCRIPTION -->
    <textarea 
        id="eventDesc" 
        class="listingInput"
        placeholder="Description"
        required
    ></textarea>

    <!-- DATE -->
    <label>Date & Time</label>
    <input 
        id="eventDate" 
        type="datetime-local"
        class="listingInput"
        required
    >

    <!-- LOCATION -->
    <input 
        id="eventLocation" 
        class="listingInput"
        placeholder="Location or 'Online'"
        required
    >

    <!-- IMAGE -->
    <label>Event Image</label>
    <input 
        id="eventImage" 
        type="file" 
        class="themeObject fileInput"
        accept="image/*"
    >

    <!-- PREVIEW -->
    <img id="eventPreview" class="eventPreview">

    <!-- ORG SELECT -->
    <label>Select Organization</label>
    <select id="eventOrg" class="listingInput" required></select>

    <!-- SUBMIT -->
    <button 
        type="button"
        id="createEventBtn" 
        class="primaryBtn"
    >
        Create Event
    </button>

</form>

<!-- SCRIPTS -->
<script type="module" src="js/createEvent.js"></script>

<script type="module">
    import { setupSidebar } from "./js/showUser.js";
    setupSidebar();
</script>

<script src="js/themeSwap.js"></script>

</body>
</html>
