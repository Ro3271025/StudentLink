<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chats | StudentLink</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/chat.css">
    <link rel="icon" type="image/png" href="styles/images/ICON.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body id="documentBody">

    <!-- HEADER -->
    <div id="header">
        <img id="logo" src="styles/images/STUDENT_LINK_LOGO.svg">
    </div>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="leftBar">
        <br>
        <img class="sideProfileIcon" id="profilePic" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"><br>
        <p id="displayName">Display Name</p>
        <p id="username">@Username</p><br>
        <p class="sidebarText"><a href="home.html">Home</a></p>
        <p class="sidebarText"><a href="listings.html">Listings</a></p>
        <p class="sidebarText"><a href="explore.html">Explore</a></p>
        <p class="sidebarText"><a href="notifications.html">Notifications</a></p>
        <p class="sidebarText"><a href="chat.html"><strong>Chat</strong></a></p>
        <p class="sidebarText"><a href="profile.html">Profile</a></p>
        <p class="sidebarText"><a href="settings.html">Settings</a></p>
        <button id="startChatBtn" class="themeObject">+ Start a Chat</button>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="sidebar" id="rightBar">
        <br>
        <input class="searchBar themeObject" placeholder="Search"><br><br>
        <div id="recentSearches">
            <table class="recentSearchesTable">
                <tr><th id="recentHeader">Recent Searches</th></tr>
            </table>
        </div>
    </div>

    <!-- CHAT CONTENT -->
    <div class="chatPage">
        <h2 class="chatTitle">Chats</h2>
        <input id="searchMessages" placeholder="Search conversations" class="searchBar"/>
        <div id="conversationsContainer"></div>
    </div>

    <!-- START CHAT MODAL -->
    <div id="chatModal" class="chatModal" style="display:none;">
        <div class="chatModalContent">
            <input type="text" id="userSearchInput" placeholder="Search users...">
            <div id="userResults"></div>
            <button id="closeModal">Close</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { setupSidebar } from "./js/showUser.js";
        setupSidebar();
    </script>
    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/userSearch.js"></script>
    <script src="js/themeSwap.js"></script>
    <script src="js/toggleVis.js"></script>

</body>
</html>
