<!DOCTYPE html>

<head>

</head>
<body id="loginBody">

        <p id="signIn">Sign in</p>

        </button>
    </div>
<script src="/js/themeSwap.js" type="text/javascript"></script>
<script type="module">
    import { setupLogin } from "/js/auth.js";
    setupLogin();
</script>
</body>
</html>
