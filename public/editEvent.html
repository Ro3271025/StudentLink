<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Event | StudentLink</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/listings.css">
    <link rel="stylesheet" href="styles/explore.css">

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body id="documentBody">

<!-- HEADER -->
<div id="header">
    <img id="logo" src="styles/images/STUDENT_LINK_LOGO.svg">
</div>

<!-- LEFT SIDEBAR -->
<div class="sidebar" id="leftBar">
<br>
<img class="sideProfileIcon" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"><br>
<p id="displayName">Display Name</p>
<p id="username">@Username</p><br>

<p class="sidebarText"><a href="home.html">Home</a></p>
<p class="sidebarText"><a href="listings.html">Listings</a></p>
<p class="sidebarText"><a href="explore.html">Explore</a></p>
<p class="sidebarText"><a href="notifications.html">Notifications</a></p>
<p class="sidebarText"><a href="chat.html">Chat</a></p>
<p class="sidebarText"><a href="profile.html">Profile</a></p>
<p class="sidebarText"><a href="settings.html">Settings</a></p>
</div>

<!-- MAIN -->
<div class="listingContainer">

<h2>Edit Event</h2>

<form id="editEventForm">

<input class="listingInput" id="titleInput" placeholder="Event Title" required>

<textarea class="listingInput" id="descInput" placeholder="Description"></textarea>

<input class="listingInput" id="locationInput" placeholder="Location">

<input class="listingInput" type="date" id="dateInput">

<!-- IMAGE -->
<label>Event Image</label>

<div id="imagePreview" class="imageGallery"></div>

<label class="uploadBtn">
    Change Image
    <input type="file" id="imageInput" hidden>
</label>

<button type="submit">Save Changes</button>

</form>

</div>

<script type="module" src="js/editEvent.js"></script>
<script src="js/themeSwap.js"></script>
<script type="module">
    import { setupSidebar } from "../public/js/showUser.js";
    setupSidebar();
</script>

</body>
</html>
