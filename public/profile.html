<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile | StudentLink</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="styles/images/ICON.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        .profileTab {
            text-decoration: none;
            color: var(--username-color);
            font-weight: normal;
            padding: 6px 12px;
            display: inline-block;
        }
        .profileTab.activeTab {
            color: var(--theme-accent);
            font-weight: bold;
            border-bottom: 2px solid var(--theme-accent);
        }
        .profileTab:hover {
            color: var(--theme-accent);
        }
        #userStats a {
            text-decoration: none;
            color: inherit;
        }
        #userStats a:hover {
            text-decoration: none;
        }
        #profileImage:hover {
            outline: 2px solid #008000;
            box-shadow: 0 0 12px rgba(0, 128, 0, 0.6);
            cursor: pointer;
        }
        .commentCard {
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            margin: 0 auto;
            width: 55%;
            padding: 12px 3.5%;
        }
        .commentCard .postTitle {
            font-size: 12pt;
            color: #586373;
            margin-bottom: 4px;
        }
        .commentCard .commentText {
            font-size: 14pt;
            color: var(--text-fill);
        }
        .sideProfileIcon {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 4px;
        }
        .profileImgMini {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            vertical-align: middle;
        }
        .followingGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 16px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .followingCard {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .followingCard:hover {
            border-color: var(--theme-accent);
        }
        .followingCard img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .followingCard .followingName {
            font-weight: 600;
            font-size: 13px;
        }
        .followingCard .followingUsername {
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body id="documentBody">

    <!-- HEADER -->
    <div id="header">
        <img id="logo" src="styles/images/STUDENT_LINK_LOGO.svg">
    </div>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="leftBar">
        <br>
        <img class="sideProfileIcon" id="sidebarProfileImg" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"><br>
        <p id="sideDisplayName">Display Name</p>
        <p id="sideUsername">@Username</p><br>
        <p class="sidebarText"><a href="home.html">Home</a></p>
        <p class="sidebarText"><a href="listings.html">Listings</a></p>
        <p class="sidebarText"><a href="explore.html">Explore</a></p>
        <p class="sidebarText"><a href="notifications.html">Notifications</a></p>
        <p class="sidebarText"><a href="chat.html">Chat</a></p>
        <p class="sidebarText"><a href="profile.html"><strong>Profile</strong></a></p>
        <p class="sidebarText"><a href="settings.html">Settings</a></p><br><br>
        <button class="themeObject" onclick="toggleOverlay('newPostContainer')">New Post</button><br><br>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="sidebar" id="rightBar">
        <br>
        <input class="searchBar themeObject" placeholder="Search"><br><br>
        <div id="recentSearches">
            <table class="recentSearchesTable">
                <tr><th id="recentHeader">Recent Searches</th></tr>
            </table>
        </div>
    </div>

    <!-- PROFILE CONTENT -->
    <div id="profileContainer" class="content">

        <div id="banner"><img src="styles/images/placeholder/DEFAULT_BANNER.svg"></div>

        <div id="profileInfo">
            <img id="profileImage" src="styles/images/placeholder/PROFILE_DEFAULT_IMAGE.SVG"
                 style="cursor:pointer; border-radius:8px; width:150px; height:150px; object-fit:cover;">
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
            <p id="profileDisplayName">Display Name</p>

            <!-- USERNAME ROW -->
            <div class="userMetaRow" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
                <span id="profileUsername">@Username</span>
                <button id="userCollege" class="themeObject">SUNY Farmingdale</button>
                <button id="messageStudentBtn" class="themeObject" style="display:none;">Message User</button>
                <button id="followBtn" class="themeObject" style="display:none;">Follow</button>
            </div>

            <p id="userStats">
                Posts: <a href="#" id="postCountLink">0</a>
                <span aria-hidden="true"> | </span>
                Listings: <a href="#" id="listingCountLink">0</a>
            </p>

            <div id="userBio">
                <button id="edit" class="themeObject">Edit Profile</button>
                <textarea id="bioText" maxlength="500" rows="5" cols="50" disabled>Hi my name is Display Name!</textarea>
            </div>
        </div>

        <!-- TAB NAVIGATION -->
        <div id="userContent">
            <table colspan="5" border="0" cellpadding="2" cellspacing="1" id="selectedContentList">
                <tr>
                    <th><a href="#" class="profileTab activeTab" data-tab="posts">Posts</a></th>
                    <th><a href="#" class="profileTab" data-tab="comments">Comments</a></th>
                    <th><a href="#" class="profileTab" data-tab="listings">Listings</a></th>
                    <th><a href="#" class="profileTab" data-tab="following">Following</a></th>
                </tr>
            </table>
        </div>

        <!-- POSTS TAB -->
        <div id="tab-posts">
            <p style="text-align:center; color:#aaa; padding:20px;" id="postsEmpty" style="display:none;">No posts yet.</p>
        </div>

        <!-- COMMENTS TAB -->
        <div id="tab-comments" style="display:none;">
            <p style="text-align:center; color:#aaa; padding:20px;" id="commentsEmpty" style="display:none;">No comments yet.</p>
        </div>

        <!-- LISTINGS TAB -->
        <div id="tab-listings" style="display:none;">
            <p style="text-align:center; color:#aaa; padding:20px;" id="listingsEmpty" style="display:none;">No listings yet.</p>
        </div>

        <!-- FOLLOWING TAB -->
        <div id="tab-following" style="display:none;">
            <p style="text-align:center; color:#aaa; padding:20px;" id="followingEmpty" style="display:none;">Not following anyone yet.</p>
        </div>

        <br>
        <button id="loadMore" class="themeObject" style="display:none;">Load More</button>

    </div>

    <!-- NEW POST OVERLAY -->
    <div class="overlayDiv">
        <div id="newPostContainer">
            <p id="newPostHeader">
                <button class="themeObject" id="closeNewPostBtn" onclick="toggleOverlay('newPostContainer')">X</button>
                <b>Create New Post</b>
                <button class="themeObject" id="createPostBtn" onclick="toggleOverlay('newPostContainer')">Post</button>
            </p>
            <div id="newPostTXT"><textarea maxlength="300" placeholder="What's happening?"></textarea></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { setupProfile } from "./js/profile.js?v=7";
        import { setupSidebar } from "./js/showUser.js";
        setupProfile();
        setupSidebar();
    </script>
    <script type="module" src="js/userSearch.js"></script>
    <script src="js/themeSwap.js" type="text/javascript"></script>
    <script src="js/toggleVis.js" type="text/javascript"></script>

</body>
</html>
